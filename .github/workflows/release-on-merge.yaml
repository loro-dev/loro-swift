name: Create Release on Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'pre-release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from Package.swift
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -o 'releases/download/[^/]*/loroFFI\.xcframework\.zip' Package.swift | sed 's|releases/download/||' | sed 's|/loroFFI\.xcframework\.zip||' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Failed to determine version from Package.swift" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine merge commit
        id: get_sha
        shell: bash
        run: |
          SHA="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$SHA" ]; then
            echo "Merge commit sha is empty" >&2
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Find pre-release workflow run and download artifact
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          RUN_ID=$(jq -r '.run_id' release-artifact.json)
          test "$(jq -r '.version' release-artifact.json)" = "$VERSION"
          SOURCE_SHA=$(jq -r '.source_sha' release-artifact.json)
          gh run view "$RUN_ID" --json conclusion,headSha > release-run.json
          test "$(jq -r '.conclusion' release-run.json)" = "success"
          test "$(jq -r '.headSha' release-run.json)" = "$SOURCE_SHA"
          gh run download "$RUN_ID" --name loroFFI.xcframework.zip --dir release-download
          mv release-download/loroFFI.xcframework.zip .
          CHECKSUM=$(jq -r '.sha256' release-artifact.json)
          PACKAGE_CHECKSUM=$(sed -n 's/.*checksum: "\([a-f0-9]*\)".*/\1/p' Package.swift)
          test "$CHECKSUM" = "$PACKAGE_CHECKSUM"
          echo "$CHECKSUM  loroFFI.xcframework.zip" | sha256sum --check

      - name: Create tag on merge commit
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          SHA=${{ steps.get_sha.outputs.sha }}
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # A published version must never be silently moved to another commit.
          git tag -a "$VERSION" -m "Release version $VERSION" "$SHA"
          git push origin "$VERSION"

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          gh release create "$VERSION" loroFFI.xcframework.zip \
            --title "Release $VERSION" \
            --notes "Automated release for version $VERSION. Includes pre-built loroFFI.xcframework.zip."

